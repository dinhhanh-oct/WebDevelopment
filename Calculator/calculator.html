<!DOCTYPE html>
<html lang="vi" data-theme="light"
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
      <style>
        /* 1. BIẾN MÀU: đổi giao diện */
        :root {
          --page: #dfe3e8;
          --body: #f7f8fa;
          --text: #1d2330;
          --muted: #6b7484;
          --lcd: #d3dbc3;                  /* màn hình kiểu LCD */
          --lcd-text: #1f2a1b;
          --key: #ffffff;
          --key-fn: #e4e8ee;
          --key-edge: #c3cad4;            /* viền dưới tạo cảm giác phím nổi */
          --op-bg: #d7efec;
          --op-text: #0f6b63;
          --equals-bg: #0f766e;
          --equals-text: #ffffff;
          --hover: 0.95;
        }
        [data-theme="dark"] {
          --page: #12161c;
          --body: #1b2129;
          --text: #e8ecf2;
          --muted: #8b94a3;
          --lcd: #1d2a24;
          --lcd-text: #b8eccb;
          --key: #2a313b;
          --key-fn: #353d49;
          --key-edge: #11151b;
          --op-bg: #1d3936;
          --op-text: #5eead4;
          --equals-bg: #14b8a6;
          --equals-text: #062521;
          --hover: 1.15;
        }

        /* 2. BỐ CỤC TRANG */
        * { box-sizing: border-box; margin: 0; }
        body {
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px 16px;
          background: var(--page);
          color: var(--text);
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          transition: background 0.2s;
        }
        .app { display: grid; gap: 20px; width: min(100%, 360px); }
        @media (min-width: 720px) {
          .app { grid-template-columns: 360px 220px; width: auto; align-items: start; }
        }

        /* 3. THÂN MÁY VÀ MÀN HÌNH */
        .calculator {
          background: var(--body);
          border-radius: 28px;
          padding: 18px;
          box-shadow: 0 24px 48px -24px rgba(20, 28, 40, 0.35);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .top-bar h1 { font-size: 1rem; font-weight: 600; color: var(--muted); }
        .theme-toggle {
          width: 36px; height: 36px;
          border: none; border-radius: 50%;
          background: var(--key-fn);
          cursor: pointer; font-size: 1rem;
        }
        .display {
          min-height: 112px;
          display: flex; flex-direction: column; justify-content: flex-end;
          margin-bottom: 16px;
          padding: 14px 16px;
          border-radius: 14px;
          background: var(--lcd);
          color: var(--lcd-text);
          text-align: right;
          box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.18);        /* màn hình lõm vào */
        }
        .expression { min-height: 1.4em; font-size: 1rem; opacity: 0.7; overflow-wrap: anywhere; }
        .result {
          font-size: 2.8rem; font-weight: 600; line-height: 1.15;
          font-variant-numeric: tabular-nums;        /* các chữ số rộng bằng nhau, không bị nhảy */
          overflow-wrap: anywhere;
        }

        /* 4. BÀN PHÍM: CSS Grid 4 cột */
        
      </style>
