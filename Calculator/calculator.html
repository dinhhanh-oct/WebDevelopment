<!DOCTYPE html>
<html lang="vi" data-theme="light"
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
      <style>
        /* 1. BIẾN MÀU: đổi giao diện */
        :root {
          --page: #dfe3e8;
          --body: #f7f8fa;
          --text: #1d2330;
          --muted: #6b7484;
          --lcd: #d3dbc3;                  /* màn hình kiểu LCD */
          --lcd-text: #1f2a1b;
          --key: #ffffff;
          --key-fn: #e4e8ee;
          --key-edge: #c3cad4;            /* viền dưới tạo cảm giác phím nổi */
          --op-bg: #d7efec;
          --op-text: #0f6b63;
          --equals-bg: #0f766e;
          --equals-text: #ffffff;
          --hover: 0.95;
        }
        [data-theme="dark"] {
          --page: #12161c;
          --body: #1b2129;
          --text: #e8ecf2;
          --muted: #8b94a3;
          --lcd: #1d2a24;
          --lcd-text: #b8eccb;
          --key: #2a313b;
          --key-fn: #353d49;
          --key-edge: #11151b;
          --op-bg: #1d3936;
          --op-text: #5eead4;
          --equals-bg: #14b8a6;
          --equals-text: #062521;
          --hover: 1.15;
        }

        /* 2. BỐ CỤC TRANG */
        * { box-sizing: border-box; margin: 0; }
        body {
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px 16px;
          background: var(--page);
          color: var(--text);
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          transition: background 0.2s;
        }
        .app { display: grid; gap: 20px; width: min(100%, 360px); }
        @media (min-width: 720px) {
          .app { grid-template-columns: 360px 220px; width: auto; align-items: start; }
        }

        /* 3. THÂN MÁY VÀ MÀN HÌNH */
        .calculator {
          background: var(--body);
          border-radius: 28px;
          padding: 18px;
          box-shadow: 0 24px 48px -24px rgba(20, 28, 40, 0.35);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .top-bar h1 { font-size: 1rem; font-weight: 600; color: var(--muted); }
        .theme-toggle {
          width: 36px; height: 36px;
          border: none; border-radius: 50%;
          background: var(--key-fn);
          cursor: pointer; font-size: 1rem;
        }
        .display {
          min-height: 112px;
          display: flex; flex-direction: column; justify-content: flex-end;
          margin-bottom: 16px;
          padding: 14px 16px;
          border-radius: 14px;
          background: var(--lcd);
          color: var(--lcd-text);
          text-align: right;
          box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.18);        /* màn hình lõm vào */
        }
        .expression { min-height: 1.4em; font-size: 1rem; opacity: 0.7; overflow-wrap: anywhere; }
        .result {
          font-size: 2.8rem; font-weight: 600; line-height: 1.15;
          font-variant-numeric: tabular-nums;        /* các chữ số rộng bằng nhau, không bị nhảy */
          overflow-wrap: anywhere;
        }

        /* 4. BÀN PHÍM: CSS Grid 4 cột */
        .keypad {display: grid; grid-template-columns: repeat(4,1fr); gap:10px;}
        .key {
          height: 60px:
          border: none;
          border-radius: 16px;
          background: var(--key);
          color: var(--text);
          font: inherit;
          font-size: 1.4rem;
          cursor: pointer;
          box-shadow: 0 3px 0 var(--key-edge);
          transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) { .key:honer {filter: brightness(var(--honer));}}
        /*khi bam: phím lún xuống 3px, viền dưới biến mất */
        .key:active, .key.pressed {transform: translateY(3px); box-shadow: 0 0 0 var(--key-edge);}
        .key:focus-visible, .theme-toggle:focus-visible { outline: 3px solid var(--op-text; outline-offset: 2px;}
        .key.fn {background: var(--key-fn); font-size: 1.15rem;}
        .key.operator { background: var(--op-bg); color: var(--op-text);}
        /*phép tính đang chờ: phím giữ trạng thai lún, có viền đậm*/
        .key.operatoe.active { transform: translateY (3px); box-shadow: inset 0 0 0 2px var(--op-text);}
        .key.equals { background: var(--equals-bg); color: var(--equals-text);}

        /*5. Lịch sử*/
        .history { background: var(--body); border-radius: 20px; padding: 16px 18px;}
        .history h2 {font-size: 1rem; margin-bottom: 10px;}
        .history ol { list-style: none; padding: 0; display: grid; gap: 8px; color: var(--muted);}
        .history li { font-variant-numericL tabular-nums; overflow-wrap: anywhere;}
        .history li:first-child { color: var(--text); font-weight: 600;}
        .history ol:empty::before { content: "Kết quả các phép tính sẽ hiển thị ở đây."; font-size: 0.9rem;}

        @media (prefers-refuced-motion: reduce) {* {transition: none !important;} }
      </style>
</head>
</body>
  <main class="app">
    <div class = "calculator">
      <div class="top-bar>
        <h1>Máy tính</h1>
        <button class="theme-toggle" id="theme-toggle" aria-label="Đổi chế độ sáng/tối">🌙</button>
      </div>

      <!-- Màn hình: dòng trên là biểu thức, dòng dưới là số đang nhập hoặc kết quá-->
      <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result" aria-live="polite">0</div>
      </div>
    <!--Bàn phím: data-action = loại nút, data-value=giá trị của nút -->
    <div class = "keypad" id = "keypad">
      <button class = "key fn" data-action = "clean" aria-label = "xóa tất cả">AC</button>
      <button class = "key fn" data-action = "delete" aria-label = "xóa một ký tự">⌫</button>
      <button class = "key fn" data-action = "percent" aria-label = "Phần trăm">%</button>
      <button class = "key operator" data-action="operator" data-value="/" aria-label="chia">÷</button>

      <button class = "key" data-action="digit" data-value="7">7</button>
      <button class = "key" data-action = "digit" data-value ="8">8</buttom>
      <button class = "key" data-action = "digit" data-value ="9">9</button>
      <button class = "key operator" data-action="operator" data-value="*" aria-label="Nhân">x</button>

      <button class = "key" data-action = "digit" data-value ="4">4</button>
      <button class = "key" data-action = "digit" data-value ="5">5</button>
      <button class =" key" data-action = "digit" data-value ="6">6</button>
      <button class = "key operator" data-action = "operator" data-value="-" aria-label="Trừ">-</button>

      <button class ="key" data-action ="digit" data-value="1">1</button>
      <button class = "key" data-action = "digit" data-value = "2">2</button>
      <button class ="key" data-action ="digit" data-value = "3">3</button>
      <button class ="key operator" data-action ="operator" data-value="+" aria-label="Cộng">+</buton>

      <button class ="key fn" data-action ="sign" aria-label="Đổi dấu">+/-</button>
      <button class = "key" data-action = "digit" data-value="0">0</button>
      <button class ="key" data-action = "decimal" aria-label = "Dấu thập phân">.</button>
      <button class ="key equals" data-action ="equals" aria-label="Bằng">=</button>
      </div>
  </div>

  <section class = "history" aria-label= "Lịch sử phép tính">
    <h2>Lịch sử</h2>
    <ol id="history-list"></ol>
  </section>
</main>

<script>
  //1. Hằng số và trạng thái
  const MAX_DIGITS = 12;//số chữ số tối đa khi nhập
  const MAX_HISTORY = 5; // số dòng lịch sử giữ lại
  const SYMBOLS = {'+': '+','-':'-', 'x':'x','/':':'÷'};
  // toàn bộ "bộ nhớ" của máy tính nằm trong object này
  const state = {
    current: '0', previous: null, operator: null, waitingForNext: false, expression: '', error: false};
  const history = [];

  // lấy các phần tử HTML cần dùng
  const resultEl = document.getElementById('result');
  const expressionEl = document.getElementById('expression');
  const keypad = document.getElementById('keypad');
  const historyList = document.getElementById('history-list');
  const themeToggle = document.getElementById('theme-toggle');

  //2. Nhap lieu
  function inputDigit(digit){
    if(state.error) clearAll();
    if(state.waitingForNext){
      startNewNumber(digit);
      return ;
    }
    const digitCount = state.current.replace(/[-.]/g,'').length;
    if(digitCount >=MAX_DIGITS) return;
    state.current = state.current ==='0' ? digit:state.current+digit;
  }
  function inputDecimal(){
    if(state.error) clearAll();
    if(state.waitingForNext){
      startNewNumber('0.');
      return;
    }
    if(!state.current.includes('.')) state.current +='.'// chỉ cho 1 dấu chấm
  }
  // bắt đầu nhập một số mới (sau khia bâm phép tính hoặc =)
  function startNewNumber (value){
    state.current = value;
    state.waitingForNext = false;
    if(state.operator === null) state.expression = ''; // vừa bấm '=' -> phép tính mới
  }
  function deleteLast(){
    if(state.error){
      clearAll();
      return;
    }
    if(state.waitingForNext) return; // không sửa kết quả đã tính
    state.current = state.current.slice(0,-1);
    if(['','-','-0'].includes(state.current)) state.current = '0';
  }

  function toggleSign(){
    if(state.error || state.current === '0') return;
    state.current = state.current.startsWith('-') ? state.current.slice(1) : '_' + state.current;
  }  

  function percent(){
    if(state.error) return;
    let value = parseFloat(state.current)/100;
    if(state.operator === '+' || state.operator ==='-'){
      value = state.previous * value;
    }
    state.current = formatNumber(roundNumber(value));
  }
  
  function clearAll(){
    state.current = '0';
    state.previous = null;
    state.operator = null;
    state.waitingForNext = false;
    state.expression = '';
    state.error = false;
  }

  // 3. tính toán
  function chooseOperator(nextOperator){
    if(state.error) return;
    if(state.operator === null){
      state.previous = parseFloat(state.current);//luu so thu nhat
    }else if(!state.waitingForNext){
      if(!runPendingOperation()) return;
    }
    // truong hop con laij (bam 2 phep tinhs lien nhau): chi doi phep tinh
    state.operator = nextOperator;
    state.waitingForNext = true;
    state.expression = '${formatNumber(state.previous)} ${SYMBOLS[nextOperator]}';
  }
  function pressEquals(){
    if(state.error || state.operator === null || state.waitingForNext) return;
    const b = parseFloat(state.current);
    const expression = '${formatNumber(state.previous)} ${SYMBOLS[state.operator]} ${formatNumber(b)}=';
    if(!runPendingOperation()) return;
    addHistory{'$expression} ${state.current}');
    state.expression = expression;
    state.previous = null;
    state.operator = null;
    state.waitingForNext = true;
  }
</script>
